<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Lumina Books</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">Lumina Books</h1>
            <nav class="menu">
                <a href="../index.html">Home</a>
                <a href="catalogo.html" class="active">Catálogo</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html">Contato</a>
            </nav>
            <div class="header-actions">
                <div id="cart-btn" class="cart-icon">
                    <span>🛒</span>
                    <span id="cart-count">0</span>
                </div
            </header>

            <section class="pagina-titulo">
                <h2>Nosso Acervo</h2>
                <p>Explore our curated collection of knowledge, imagination, and wisdom.</p>
            </section>

            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="book-search" placeholder="Pesquisar livro ou autor...">
                </div>
                <div class="filtros">
                    <button class="btn-filtro active">Todos</button>
                    <button class="btn-filtro">Romance</button>
                    <button class="btn-filtro">Fantasia</button>
                    <button class="btn-filtro">Ficção Científica</button>
                    <button class="btn-filtro">Suspense</button>
                    <button class="btn-filtro">Desenvolvimento Pessoal</button>
                    <button class="btn-filtro">Clássicos</button>
                </div>
            </section>

            <section id="book-grid" class="produtos">
            </section>

            <footer>
                <div class="footer-info">
                    <nav class="menu">
                        <a href="../index.html">Home</a>
                        <a href="catalogo.html">Catálogo</a>
                        <a href="sobre.html">Sobre</a>
                        <a href="contato.html">Contato</a>
                    </nav>
                    <nav class="redes-sociais">
                        <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
                        <a href="https://pinterest.com" target="_blank" rel="noopener">Pinterest</a>
                        <a href="https://wa.me/seunumero" target="_blank" rel="noopener">WhatsApp</a>
                    </nav>
                </div>
                <p>&copy; 2026 - Lumina Books. Todos os direitos reservados.</p>
            </footer>
        </div>

        <div id="book-modal" class="modal"></div>
        <div id="cart-modal" class="modal cart-modal">
            <div class="modal-content cart-content">
                <span id="close-cart" class="close-modal">&times;</span>
                <h2>Seu Carrinho</h2>
                <div id="cart-items"></div>
                <div class="cart-footer">
                    <p id="cart-total">Total: R$ 0,00</p>
                    <button class="btn-checkout">Finalizar Compra</button>
                </div>
            </div>
        </div>

        <script src="../js/books.js"></script>
        <script src="../js/cart.js"></script>
        <script src="../js/main.js"></script>
    </body>
    </html>
